<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geocaches Found</title>
  <link rel="stylesheet" href="./css/geocaches-found.css" />
</head>
<body>

  <!--NAV_MENU-->

  <main class="container">
    <header class="page-header">
      <h1>Geocaches Found</h1>
      <p class="page-stats">
        Showing <strong id="showing-count">{{ total_count }}</strong> of <strong id="total-count">{{ total_count }}</strong>
      </p>
    </header>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search by name or GC Code..." />
      <select id="yearFilter"><option value="">All Years</option></select>
      <select id="countryFilter"><option value="">All Countries</option></select>
      <select id="provinceFilter" disabled><option value="">All Provinces</option></select>
    </section>

    <div id="geocaches-grid" class="grid-container">
      {{ content }}
    </div>
  </main>

  <script type="module" src="./scripts/geocachesFound-controls.js"></script>
</body>
</html>
