<article class="photo-card">
  <div class="photo-wrapper">
    <img src="/webp-images/photo-album/{{ Path }}/{{ Image }}" alt="{{ Name }}" loading="lazy">
  </div>
  <div class="photo-meta">
    <p class="photo-description">{{ Description }}</p>
	<span class="photo-card-date">{{Date}}</span>
  </div>
</article>
