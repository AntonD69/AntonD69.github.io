<article class="index-card">
  <a href="{{Link}}" class="index-card-link">
    <div class="index-card-image-wrapper">
      <img src="/webp-images/photo-album/{{ Path }}/{{ Image }}" alt="{{Name}}" loading="lazy">
    </div>
    <div class="index-card-content">
      <h2 class="index-card-title">{{Name}}</h2>
      <p class="index-card-description">{{Description}}</p>
    </div>
  </a>
</article>
