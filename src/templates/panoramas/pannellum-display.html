<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panorama Viewer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    #panorama {
      width: 100vw;
      height: 100vh;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.6);
      font-size: 24px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .close-btn:hover {
      background: rgba(255, 0, 0, 0.8);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <button class="close-btn" onclick="window.close();" title="Close Viewer">&times;</button>
  <div id="panorama"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    const panoImg = params.get('pano');
    const haov = parseFloat(params.get('haov')) || 360;
    const vaov = parseFloat(params.get('vaov')) || 35;
    const pitch = parseFloat(params.get('pitch')) || 0;
    const hfov = parseFloat(params.get('hfov')) || 60;
    const minHfov = parseFloat(params.get('minHfov')) || 0;
    const maxHfov = parseFloat(params.get('maxHfov')) || 90;
    const title = params.get('title') || '';

    if (title) document.title = title;

    if (panoImg) {
      const config = {
        "type": "equirectangular",
        "panorama": "/webp-images/panoramas/images/" + panoImg,
        "autoLoad": true,
        "haov": haov,
        "vaov": vaov,
        "pitch": pitch,
        "hfov": hfov,
        "minHfov": minHfov,
        "maxHfov": maxHfov,
        "title": title
      };

      // Set boundary locks if it's a partial panorama (< 360°)
      if (haov < 360) {
        const halfHaov = haov / 2;
        config.minYaw = -halfHaov;
        config.maxYaw = halfHaov;
      }

      pannellum.viewer('panorama', config);
    } else {
      document.getElementById('panorama').innerHTML = '<p style="color:white;text-align:center;padding-top:20%;">No panorama image specified.</p>';
    }
  </script>

</body>
</html>
