<div class="pano-card">
  <a href="{{ ViewerUrl }}" target="_blank" rel="noopener noreferrer" class="pano-card-link">
    <div class="pano-thumb-wrapper">
      <img src="/webp-images/panoramas/thumbnails/{{ Thumbnail-Image }}" alt="{{ Name }}" class="pano-thumb" loading="lazy" />
    </div>
    <div class="pano-card-info">
      <h3 class="pano-title">{{ Name }}</h3>
      <div class="pano-meta">
        <span class="pano-date">{{ Date }}</span>
      </div>
    </div>
  </a>
</div>
