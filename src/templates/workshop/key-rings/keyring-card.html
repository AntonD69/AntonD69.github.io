<div class="keyring-card">
  <div>
    <h3 class="card-title-full">{{ Name }}</h3>

    <div class="details">
      <!-- Card Image Container with Navigation Arrows -->
      <div class="card-image-container" data-images='{{ ImagesJson }}' data-current-index="0">
        <button class="slider-btn prev-btn" aria-label="Previous image">&lt;</button>
        
        <img src="/webp-images/workshop/keyrings/{{ ImageName }}" class="keyring-thumb" alt="Keyring-set-{{ ID }}" />
        
        <button class="slider-btn next-btn" aria-label="Next image">&gt;</button>
        <span class="image-counter">1/1</span>
      </div>

      <!-- Card Meta Table -->
      <div class="card-meta-table">
        <div class="meta-row">
          <span class="meta-left project-id">Project #{{ ID }}</span>
          <span class="meta-right">Qty: <strong>{{ Quantity }}</strong></span>
        </div>
        <div class="meta-row">
          <span class="meta-left">📅 {{ Date }}</span>
          <span class="meta-right">Total: <strong>{{ RunningTotal }}</strong></span>
        </div>
      </div>
    </div>
  </div>
</div>
