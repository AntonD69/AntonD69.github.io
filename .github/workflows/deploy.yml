name: Deploy to GitHub Pages and VPS

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual re-triggering from GitHub UI if needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. BUILD
  # ==========================================
  build:
    name: 1. Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Save dist output as an artifact for downstream jobs
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: './dist'
          retention-days: 1

      # Prepare and upload GitHub Pages artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ==========================================
  # 2. DEPLOY TO GITHUB PAGES
  # ==========================================
  deploy-pages:
    name: 2. Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # 3. DEPLOY TO UBUNTU SERVER (VPS)
  # ==========================================
  deploy-vps:
    name: 3. Deploy to Ubuntu VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Download the pre-built dist folder from the Build job
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: './dist'

      - name: Set Custom Zip Filename Variable
        run: echo "DEPLOY_FILENAME=prd-backToTheAdventure-static($(date +'%Y-%m-%d_%H-%M-%S')).zip" >> $GITHUB_ENV

      - name: Create Zip Archive
        run: |
          cd dist
          zip -r "../${{ env.DEPLOY_FILENAME }}" .

      - name: Copy Zip Archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEVOOPS_HOST }}
          username: ${{ secrets.DEVOOPS_USERNAME }}
          key: ${{ secrets.DEVOOPS }}
          port: 22
          source: "${{ env.DEPLOY_FILENAME }}"
          target: "/srv/www/deployment-backups"

      - name: Unzip and Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_FILENAME: ${{ env.DEPLOY_FILENAME }}
        with:
          host: ${{ secrets.DEVOOPS_HOST }}
          username: ${{ secrets.DEVOOPS_USERNAME }}
          key: ${{ secrets.DEVOOPS }}
          port: 22
          envs: DEPLOY_FILENAME
          script: |
            rm -rf /srv/www/prd-backToTheAdventure-static/*
            unzip -o "/srv/www/deployment-backups/$DEPLOY_FILENAME" -d /srv/www/prd-backToTheAdventure-static